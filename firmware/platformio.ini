; Smart Learning Center - single ESP32 firmware
; Technological University of the Philippines - Group 3
; PlatformIO project, built/simulated with the Wokwi VS Code extension.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Library versions are pinned to releases that are known to work with the
; ESP32 Arduino core used by Wokwi at the time this was written (Sep 2026).
; If Wokwi's bundled core changes, these may need to be bumped - see README
; troubleshooting section.
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    miguelbalboa/MFRC522 @ ^1.4.11
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    madhephaestus/ESP32Servo @ ^3.0.5

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D CONFIG_ARDUHAL_LOG_COLORS=0
